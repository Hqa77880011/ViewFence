[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viewfence"
version = "0.2.0"
description = "ViewFence implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24","scipy>=1.11","matplotlib>=3.7","psutil>=5.9","scikit-learn>=1.3","joblib>=1.3"]

[project.scripts]
viewfence = "viewfence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

